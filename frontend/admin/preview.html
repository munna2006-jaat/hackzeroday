<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview | HackZeroDay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #070907;
        color: #f3fff8;
        font-family: Inter, system-ui, sans-serif;
      }
      .preview-banner {
        padding: 0.6rem 1rem;
        background: rgba(255, 180, 84, 0.12);
        border-bottom: 1px solid rgba(255, 180, 84, 0.25);
        color: #ffb454;
        font-size: 0.85rem;
        text-align: center;
      }
      #previewRoot {
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }
    </style>
    <style id="previewCss"></style>
  </head>
  <body>
    <div class="preview-banner">Draft preview — interactive questions are disabled here.</div>
    <div id="previewRoot"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const roomId = params.get("roomId");
      const raw = roomId ? sessionStorage.getItem(`hzd_preview_${roomId}`) : null;
      if (!raw) {
        document.getElementById("previewRoot").innerHTML = "<p>No preview data found. Save or preview from the editor.</p>";
      } else {
        const data = JSON.parse(raw);
        document.title = `${data.title} | Preview`;
        document.getElementById("previewCss").textContent = data.css || "";
        document.getElementById("previewRoot").innerHTML = data.html || "";
      }
    </script>
  </body>
</html>
